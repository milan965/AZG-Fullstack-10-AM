<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        header{
            padding: 20px;
            background-color: orange;
        }
        ul{
            list-style-type: none;
        }
        .logo{
            width: 30%;
            float: left;
        }
        .menu{
            width: 70%;
            float: right;
        }
        .clear{
            clear: both;
        }

        .menu ul li{
            float: right;
            margin: 10px 20px;
        }
        .menu ul li a{
            font-size: 20px;
        }

        .box-1{
            width: 25%;
            float: left;
            padding: 10px;
        }
        .box-2{
            width: 25%;
            background-color: rgb(132, 255, 0);
            float: left;
            padding: 10px;
        }
        .box-3{
            width: 25%;
            background-color: rgb(72, 0, 255);
            float: left;
            padding: 10px;

        }
        .box-4{
            width: 25%;
            background-color: rgb(255, 0, 247);
            float: left;
            padding: 10px;
        }
        .hero-section{
            background-image: url('https://www.w3schools.com/w3images/mac.jpg');
            padding: 200px 50px;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }
        .hero-section h1{
            color: white;
            font-size: 60px;
            font-weight: lighter;
            margin-bottom: 50px;
        }
         .hero-section p{
            color: white;
            margin-bottom: 40px;
            font-size: 25px;
            font-weight: lighter;
        }

        .hero-section button{
            padding: 20px 50px;
            background-color: white;
            opacity: 0.3;
            font-size: 20px;
            border: none;
        }

        .hero-section ul li{
            float: left;
            margin: 100px 10px;
        }
        .hero-section ul li a i{
            color: grey;
            font-size: 50px;
        }

    </style>
</head>
<body>
    
    
    <header>

        <div class="logo">
            <a href="#">
                <h1>Logo</h1>
            </a>
        </div>
        <div class="menu">
            <ul>
                <li>
                    <a>Products</a>
                </li>
                <li>
                    <a>Contact</a>
                </li>
                <li>
                    <a>About</a>
                </li>
                <li>
                    <a>Home</a>
                </li>
            </ul>
        </div>

        <div class="clear"></div>

    </header>


    <main>

        <section>

            <div class="box-main">

                <div class="box-1">
                    <h2>Html</h2>
                    <img width="100%" src="https://web.dev/static/html/image/hero-html_480.png" alt="">
                </div>
                <div class="box-2">
                    box-2
                </div>
                <div class="box-3">
                    box-3
                </div>
                <div class="box-4">
                    box-4
                </div>

                <div class="clear"></div>

            </div>

        </section>



        <section>
            <div class="hero-section">

                <h1>Start something that matters</h1>
                <p>Stop wasting valuable time with projects that just aren't you.</p>
                <button>Learn more and start today</button>

                <ul>
                    <li>
                        <a href="#">
                           <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>
                </ul>

            </div>
        </section>

    </main>
    

</body>
</html>
