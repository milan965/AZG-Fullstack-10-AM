<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        header{
            background-color: orange;
            padding: 10px;
            box-shadow: 2px 2px 10px black;
        }
        header .logo{
            display: inline-block;
            
            width: 30%;
        }
        header .menu{
            display: inline-block;
              width: 69%;      
        }
        ul{
            list-style-type: none;
        }
        header .menu ul{
            float: right;
        }
        header .menu ul li{
            display: inline-block;
            margin: 0px 20px;
        }
        a{
            color: white;
            text-decoration: none;
            padding: 10px 30px;
        }
         header .menu ul li a:hover{
            /* background-color: yellow; */
            border: 1px solid black;
         }
    </style>
</head>
<body>
    

   
    <header>
        <div class="logo">
            <h1>Logo</h1>
        </div>
        <div class="menu">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="#">Contact</a>
                </li>
                <li>
                    <a href="#">Product</a>
                </li>
                <li>
                    <a href="#">Services</a>
                </li>
            </ul>
        </div>
    </header>



</body>
</html>
